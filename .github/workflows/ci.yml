name: Plugin CI

# KBT-F454 (KBT-E089): the plugin repo had no CI, so version drift between
# marketplace.json and plugin.json shipped unnoticed. This workflow runs the
# node:test suite (which includes the version-sync guard) plus an explicit
# version-sync check on every push and PR.

on:
  push:
    branches: ["**"]
  pull_request:

# Zonder dit blok krijgt GITHUB_TOKEN de repo-default. Die staat vandaag op
# 'read', dus de blootstelling is nu klein — maar dat is een instelling elders
# (Settings -> Actions -> Workflow permissions, of een org-default), niet iets
# wat deze workflow zelf vastlegt. Zet iemand die om naar read/write, dan krijgt
# dit script-uitvoerende job stilzwijgend schrijfrechten op de hele repo.
# Expliciet dichtzetten op het minimum: checkout heeft contents:read nodig, en
# check-version-sync.js en check-release-notes.js raken de GitHub-API niet.
# CodeQL actions/missing-workflow-permissions.
permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, linux, x64, baremetal]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 22+ — `node --test` expands glob patterns natively (Node 20 does not,
          # which made `npm test`'s "plugin/tests/*.test.js" glob fail to match).
          node-version: "22"
      - name: Run plugin test suite
        run: npm test
      - name: Version-sync guard (marketplace.json <-> plugin.json)
        run: npm run check:version
      # KBT-B545: the release ritual lived entirely in agent attentiveness — no release
      # workflow, no enforcement, and a Kanbantic Version registry that fell nineteen
      # minors behind as a result. Registering the Version needs API credentials this CI
      # does not have; requiring notes for a shipped number does not, and the repo's own
      # history (19 notes without a tag, 4 tags without notes) shows it is worth checking.
      - name: Release-notes guard (a shipped version must say what it contains)
        run: npm run check:notes
